<script>
  // প্রোডাক্টের তথ্য
  const products = {
    charger: [
      { name: "67W Fast Charger", price: "১২০০ টাকা", img: "charger.jpg" }
    ],
    headphone: [
      { name: "TWS Earbuds", price: "১৫০০ টাকা", img: "earbuds.jpg" }
    ]
  };

  function showProducts(catKey) {
    document.getElementById('category-section').style.display = 'none';
    document.getElementById('product-section').style.display = 'block';

    const listDiv = document.getElementById('product-list');
    listDiv.innerHTML = '';

    const items = products[catKey] || [];
    if (items.length === 0) {
      listDiv.innerHTML = '<p>কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
      return;
    }

    items.forEach(item => {
      listDiv.innerHTML += `
        <div class="product-card">
          <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60'">
          <div>
            <b>${item.name}</b><br>
            <span>দাম: ${item.price}</span>
            <div style="margin-top: 10px; display: flex; gap: 5px;">
              <a href="https://wa.me/8801716390762?text=আমি%20${item.name}%20অর্ডার%20করতে%20চাই" target="_blank" style="background: #25D366; color: white; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">💬 WhatsApp</a>
              <a href="https://wa.me/8801716390762?text=আমি%20${item.name}%20অর্ডার%20করতে%20চাই" target="_blank" style="background: #FF6B00; color: white; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">🛒 Order Now</a>
            </div>
          </div>
        </div>
      `;
    });
  }

  function showCategories() {
    document.getElementById('product-section').style.display = 'none';
    document.getElementById('category-section').style.display = 'grid';
  }
</script>

</body>
</html>
