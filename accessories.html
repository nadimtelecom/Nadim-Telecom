<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মোবাইল এক্সেসরিজ</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 20px; }
    .header { background-color: #0d1b2a; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .card:hover { background: #e0e0e0; }
    .btn-back { background: #0d1b2a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
    .product-list { margin-top: 20px; }
    .product-card { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 8px; text-align: left; display: flex; align-items: center; gap: 15px; }
    .product-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>🎧 মোবাইল এক্সেসরিজ</h2>
  </div>

  <!-- ক্যাটাগরি গ্রিড -->
  <div id="category-section" class="grid">
    <div class="card" onclick="showProducts('charger')">🔌<br><b>ফাস্ট চার্জার ও কেবল</b></div>
    <div class="card" onclick="showProducts('headphone')">🎧<br><b>হেডফোন ও ইয়ারফোন</b></div>
    <div class="card" onclick="showProducts('glass')">🛡️<br><b>গ্লাস প্রটেক্টর</b></div>
    <div class="card" onclick="showProducts('cover')">📱<br><b>ব্যাক কভার ও কেসিং</b></div>
  </div>

  <!-- প্রোডাক্ট শো করার সেকশন -->
  <div id="product-section" style="display: none;">
    <h3 id="category-title"></h3>
    <div id="product-list" class="product-list"></div>
    <button class="btn-back" onclick="showCategories()">⬅ ক্যাটাগরি তালিকায় ফিরে যান</button>
  </div>
</div>

<script>
  // প্রোডাক্টের তথ্য
  const products = {
    charger: [
      { name: "67W Fast Charger", price: "১২০০ টাকা", img: "charger.jpg" }
    ],
    headphone: [
      { name: "TWS Earbuds", price: "১৫০০ টাকা", img: "earbuds.jpg" }
    ]
  };

  function showProducts(catKey) {
    document.getElementById('category-section').style.display = 'none';
    document.getElementById('product-section').style.display = 'block';
    
    const listDiv = document.getElementById('product-list');
    listDiv.innerHTML = '';
    
    const items = products[catKey] || [];
    if(items.length === 0) {
      listDiv.innerHTML = '<p>কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
      return;
    }

    items.forEach(item => {
      listDiv.innerHTML += `
        <div class="product-card">
          <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60'">
          <div>
            <b>${item.name}</b><br>
            <span>দাম: ${item.price}</span>
          </div>
        </div>
      `;
    });
  }

  function showCategories() {
    document.getElementById('product-section').style.display = 'none';
    document.getElementById('category-section').style.display = 'grid';
  }
</script>

</body>
</html>
