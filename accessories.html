<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোবাইল এক্সেসরিজ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 8px; }
        .header { background-color: #0d1b2a; color: white; text-align: center; padding: 10px; border-radius: 5px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; text-align: center; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .card:hover { background: #e0e0e0; }
        .btn-back { background: #0d1b2a; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        .product-list { margin-top: 20px; }
        .product-card { border: 1px solid #eee; padding: 10px; margin-top: 10px; display: flex; gap: 10px; align-items: center; border-radius: 5px; }
        .product-card img { width: 60px; height: 60px; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎧 মোবাইল এক্সেসরিজ</h2>
    </div>

    <!-- ক্যাটাগরি গ্রিড -->
    <div id="category-section" class="grid">
        <div class="card" onclick="showProducts('charger')">🔌<br>চার্জার</div>
        <div class="card" onclick="showProducts('headphone')">🎧<br>হেডফোন</div>
        <div class="card" onclick="showProducts('glass')">🛡️<br>গ্লাস প্রটেক্টর</div>
        <div class="card" onclick="showProducts('cover')">📱<br>ব্যাক কভার</div>
    </div>

    <!-- প্রোডাক্ট শো করার সেকশন -->
    <div id="product-section" style="display: none;">
        <h3 id="category-title"></h3>
        <div id="product-list" class="product-list"></div>
        <button class="btn-back" onclick="showCategories()">← ক্যাটাগরিতে ফিরুন</button>
    </div>
</div>

<script>
  // প্রোডাক্টের তথ্য
  const products = {
    charger: [
      { name: "67W Fast Charger", price: "১২০০ টাকা", img: "charger.jpg" }
    ],
    headphone: [
      { name: "TWS Earbuds", price: "১৫০০ টাকা", img: "earbuds.jpg" }
    ]
  };

  function showProducts(catKey) {
    document.getElementById('category-section').style.display = 'none';
    document.getElementById('product-section').style.display = 'block';

    const listDiv = document.getElementById('product-list');
    listDiv.innerHTML = '';

    const items = products[catKey] || [];
    if (items.length === 0) {
      listDiv.innerHTML = '<p>কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
      return;
    }

    items.forEach(item => {
      listDiv.innerHTML += `
        <div class="product-card">
          <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60'">
          <div>
            <b>${item.name}</b><br>
            <span>দাম: ${item.price}</span>
            <div style="margin-top: 10px; display: flex; gap: 5px;">
              <a href="https://wa.me/8801716390762?text=আমি%20${item.name}%20অর্ডার%20করতে%20চাই" target="_blank" style="background: #25D366; color: white; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">💬 WhatsApp</a>
              <a href="https://wa.me/8801716390762?text=আমি%20${item.name}%20অর্ডার%20করতে%20চাই" target="_blank" style="background: #FF6B00; color: white; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">🛒 Order Now</a>
            </div>
          </div>
        </div>
      `;
    });
  }

  function showCategories() {
    document.getElementById('product-section').style.display = 'none';
    document.getElementById('category-section').style.display = 'grid';
  }
</script>

</body>
</html>
